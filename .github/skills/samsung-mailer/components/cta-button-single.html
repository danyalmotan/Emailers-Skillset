<!-- COMPONENT: cta-button-single | Source: ZAS26088065 Miracle Launch 3 Buds Users, ZAS26088065 Miracle Launch 2 SA, ZAS26088068 Micro RGB | Usage: Single centred CTA button row — swap href, src, width, height, alt -->

<!-- ============================================================
     VARIANT A: Centred button image inside a full-width table
     Standard pattern used across all Samsung SA mailers.
     Button is an image (not live text) — swap the image src.
     Source: ZAS26088065 Miracle Launch 3 Buds Users (line 169), ZAS26088065 Miracle Launch 2 SA (line 186)
     ============================================================ -->
<table align="center" border="0" cellpadding="0" cellspacing="0" style="background-color:[BG_COLOUR e.g. #ffffff];" width="600">
    <tbody>
        <tr>
            <td style="text-align: center;">
                <a href="[CTA_URL]" target="_blank"><img alt="[BUTTON_ALT_TEXT e.g. Shop now]" height="50" src="[BUTTON_IMAGE_URL]" style="height: 50px; display: block; margin: auto; width: [WIDTH e.g. 196]px;" width="[WIDTH e.g. 196]"></a>
            </td>
        </tr>
    </tbody>
</table>

        </tr>
        <tr>
            <td style="text-align: center;"><br>
                &nbsp;&nbsp;</td>
        </tr>
    </tbody>
</table>
