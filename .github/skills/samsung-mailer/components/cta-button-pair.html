<!-- COMPONENT: cta-button-pair | Source: ZAS26088065 Miracle Launch 3 Buds Users, ZAS26088065 Miracle Launch 2 SA, ZAS26088075 S26 Brandstores | Usage: Two CTA buttons side by side — swap hrefs, srcs, widths, alts -->

<!-- ============================================================
     VARIANT A: Two equal-width buttons in a 49% / spacer / 49% column layout
     Right button aligns right, left button aligns left (float pattern)
     Source: ZAS26088065 Miracle Launch 3 Buds Users (lines 60–63)
     ============================================================ -->
<table align="center" border="0" cellpadding="0" cellspacing="0" style="background-color:[BG_COLOUR e.g. #CFD6EB]; width:100%;" width="600">
    <tbody>
        <tr>
            <td style="text-align: center;">
                <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;">
                    <tbody>
                        <tr>
                            <td style="text-align: right; width: 49%;"><a href="[LEFT_BUTTON_URL]"><img align="right" alt="[LEFT_BUTTON_ALT e.g. Buy now]" height="50" src="[LEFT_BUTTON_IMAGE_URL]" style="height: 50px; display: block; margin: auto; width: [WIDTH e.g. 172]px; float: right;" width="[WIDTH e.g. 172]"></a></td>
                            <td style="width: 20px;">&nbsp; &nbsp; &nbsp;</td>
                            <td style="text-align: left; width: 49%;"><a href="[RIGHT_BUTTON_URL]"><img align="left" alt="[RIGHT_BUTTON_ALT e.g. Compare]" height="50" src="[RIGHT_BUTTON_IMAGE_URL]" style="height: 50px; display: block; margin: auto; width: [WIDTH e.g. 172]px; float: left;" width="[WIDTH e.g. 172]"></a></td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </tbody>
</table>


<!-- ============================================================
     VARIANT B: Two buttons split across two 300px half-columns (full-width image buttons)
     Source: ZAS26088065 Miracle Launch 2 SA (lines 72–75)
     ============================================================ -->
<table align="center" border="0" cellpadding="0" cellspacing="0" style="background-color:[BG_COLOUR e.g. #8D91B9];" width="600">
    <tbody>
        <tr>
            <td>
                <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;">
                    <tbody>
                        <tr>
                            <td><a href="[LEFT_BUTTON_URL]" target="_blank"><img alt="[LEFT_BUTTON_ALT e.g. Pre-order now]" height="50" src="[LEFT_BUTTON_IMAGE_URL]" style="width: 300px; height: 50px; display: block;" width="300"></a></td>
                            <td><a href="[RIGHT_BUTTON_URL]" target="_blank"><img alt="[RIGHT_BUTTON_ALT e.g. Find a store]" height="50" src="[RIGHT_BUTTON_IMAGE_URL]" style="width: 300px; height: 50px; display: block;" width="300"></a></td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </tbody>
</table>


<!-- ============================================================
     VARIANT C: Two buttons side by side with a fixed 30px gap column between them
     Used in Brandstores mailer for "Shop online" + "Find a store" pair
     Source: ZAS26088075 S26 Brandstores (lines 533–538)
     ============================================================ -->
<table align="center" border="0" cellpadding="0" cellspacing="0" style="background-color:[BG_COLOUR e.g. #ffffff]; width:100%;" width="600">
    <tbody>
        <tr>
            <td style="text-align: center;">
                <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;">
                    <tbody>
                        <tr>
                            <td style="width: 250px;"><a href="[LEFT_BUTTON_URL]"><img align="right" alt="[LEFT_BUTTON_ALT e.g. Shop online]" height="50" src="[LEFT_BUTTON_IMAGE_URL]" style="width: [WIDTH e.g. 178]px; height: 50px; display: block; margin: auto; float: right;" width="[WIDTH e.g. 178]"></a></td>
                            <td style="width: 30px;"></td>
                            <td><a href="[RIGHT_BUTTON_URL]"><img align="left" alt="[RIGHT_BUTTON_ALT e.g. Find a store]" height="50" src="[RIGHT_BUTTON_IMAGE_URL]" style="width: [WIDTH e.g. 238]px; height: 50px; display: block; margin: auto; float: left;" width="[WIDTH e.g. 238]"></a></td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </tbody>
</table>
