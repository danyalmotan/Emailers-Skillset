<!-- COMPONENT: banner-534px | Source: ZAS26088075 S26 Brandstores (sliced border frame inner table pattern) | Usage: Centred 534px banner inside a 600px container — 33px spacer columns each side (600 - 534 = 66 / 2 = 33) -->

<table align="center" border="0" cellpadding="0" cellspacing="0" style="background-color:[BG_COLOUR e.g. #ffffff];" width="600">
    <tbody>
        <tr>
            <!-- Left 33px spacer -->
            <td width="33">&nbsp;</td>
            <!-- 534px banner image -->
            <td style="text-align:center;" width="534">
                <a href="[PRODUCT_URL]" target="_blank"><img alt="[ALT_TEXT]" border="0" height="[HEIGHT]" src="[BANNER_IMAGE_URL]" style="display:block; width:534px; height:[HEIGHT]px;" width="534"></a>
            </td>
            <!-- Right 33px spacer -->
            <td width="33">&nbsp;</td>
        </tr>
    </tbody>
</table>


<!-- ============================================================
     NOTE: The 520px inner frame variant (used in Miracle Launch 2 SA sliced-border card)
     uses 40px spacers each side (600 - 520 = 80 / 2 = 40).
     The pattern below matches that exact layout from source.
     ============================================================ -->
<table align="center" border="0" cellpadding="0" cellspacing="0" style="background-color:[BG_COLOUR e.g. #8D91B9];" width="600">
    <tbody>
        <tr>
            <td style="text-align: center;">
                <table align="center" border="0" cellpadding="0" cellspacing="0" width="520">
                    <tbody>
                        <tr>
                            <td style="text-align:center;">
                                <a href="[PRODUCT_URL]" target="_blank"><img alt="[ALT_TEXT]" border="0" height="[HEIGHT]" src="[BANNER_IMAGE_URL]" style="display:block; width:520px; height:[HEIGHT]px; margin:auto;" width="520"></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </tbody>
</table>
