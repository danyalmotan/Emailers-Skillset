<!-- COMPONENT: spacer-row | Source: ZAS26088081 FNB Miracle, ZAS26088075 S26 Brandstores, ZAS26088068 Micro RGB | Usage: Standard spacer rows in 10px, 20px, 30px heights — copy the relevant variant between content sections -->

<!-- ============================================================
     10px spacer — tight gap between sub-sections
     Source: ZAS26088081 FNB (lines 43, 88, 97, 151, 196)
     ============================================================ -->
<table align="center" border="0" cellpadding="0" cellspacing="0" width="600">
    <tbody>
        <tr>
            <td height="10" style="font-size:1px; line-height:1px;">&nbsp;</td>
        </tr>
    </tbody>
</table>


<!-- ============================================================
     20px spacer — standard gap between content rows
     Source: ZAS26088081 FNB (lines 43, 88, 97, 151, 196, 263)
     ============================================================ -->
<table align="center" border="0" cellpadding="0" cellspacing="0" width="600">
    <tbody>
        <tr>
            <td height="20" style="font-size:1px; line-height:1px;">&nbsp;</td>
        </tr>
    </tbody>
</table>


<!-- ============================================================
     30px spacer — generous gap between major sections
     Source: ZAS26088081 FNB (lines 255, 271, 279), ZAS26088068 Micro RGB (line 241, 265)
     ============================================================ -->
<table align="center" border="0" cellpadding="0" cellspacing="0" width="600">
    <tbody>
        <tr>
            <td height="30" style="font-size:1px; line-height:1px;">&nbsp;</td>
        </tr>
    </tbody>
</table>


<!-- ============================================================
     Inline br spacer — used INSIDE a td cell for vertical breathing room
     Common pattern across all mailers (non-table spacer approach)
     ============================================================ -->
<!-- Small (approx 10px visual) -->
<tr>
    <td style="text-align: center;">&nbsp;&nbsp;</td>
</tr>

<!-- Medium (approx 20px visual — double br) -->
<tr>
    <td style="text-align: center;"><br>
        &nbsp; &nbsp;</td>
</tr>

<!-- Large (approx 30–40px visual — triple br) -->
<tr>
    <td style="text-align: center;"><br>
        <br>
        &nbsp; &nbsp;&nbsp;</td>
</tr>
